[package]
name = "code-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process coding-agent engine powering cockpit-code"
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
code-config = { path = "../code-config" }
serde.workspace = true
serde_json.workspace = true
serde-saphyr = "2.1"
toml = "1.2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tempfile.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
libc = "0.2"
regex = "1"
ignore = "0.4"
globset = "0.4"
notify = "8"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
url = "2"
grep-regex = "0.1"
grep-searcher = "0.1"

httpdate = "1"
anyhow = "1"
similar = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tiktoken-rs = "0.12"
brush-parser = "0.4"
htmd = "0.5"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

monty = "1.5"
monty-types = "1.5"
webpki-root-certs = "1.0.11"

[features]
intel-c = ["dep:tree-sitter-c"]
intel-cpp = ["dep:tree-sitter-cpp"]
