[package]
name = "code-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terminal user interface for cockpit-code"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
code-config = { path = "../code-config" }
code-engine = { path = "../code-engine" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
similar = "2.7"
ignore = "0.4"
unicode-width = "0.2"
vt100 = "0.18"
libc = "0.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3", default-features = false }
