[workspace]
members = ["crates/code-config", "crates/code-engine", "crates/code-tui", "crates/code-acp", "apps/cockpit-code"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["FlyCockpit LLC"]
repository = "https://github.com/FlyCockpit/cockpit-code"
homepage = "https://github.com/FlyCockpit/cockpit-code"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
