# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # bincode 1 is unmaintained. Only syntect's bundled syntax dumps use it.
    { id = "RUSTSEC-2025-0141", reason = "via syntect built-in assets only" },
    # atomic-polyfill is unmaintained. Pulled in by monty -> postcard -> heapless 0.7.
    { id = "RUSTSEC-2023-0089", reason = "via monty; no upstream fix" },
    # Owner decision 2026-11-23: chrono 0.4.45 is used directly by code-engine and
    # code-tui for timestamps and is required by monty / monty-types 1.6.0, which we
    # don't control. Remove when monty moves off chrono (then replace our own chrono
    # use) or at expiry, whichever comes first.
    # drop-after: 2027-01-23
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, used directly by code-engine/code-tui for timestamps and transitively required by monty / monty-types; expires 2027-01-23." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
