# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # bincode 1 is unmaintained. Only syntect's bundled syntax dumps use it.
    { id = "RUSTSEC-2025-0141", reason = "via syntect built-in assets only" },
    # atomic-polyfill is unmaintained. Pulled in by monty -> postcard -> heapless 0.7.
    { id = "RUSTSEC-2023-0089", reason = "via monty; no upstream fix" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
